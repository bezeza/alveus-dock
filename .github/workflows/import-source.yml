name: Import Alveus Dock source snapshot

on:
  push:
    branches: [main]
    paths:
      - "migration/alveus-dock-0.1.2-source.zip"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/alveus-dock-import
          unzip -q migration/alveus-dock-0.1.2-source.zip -d /tmp/alveus-dock-import
          test -d /tmp/alveus-dock-import/alveus-dock
          cp -a /tmp/alveus-dock-import/alveus-dock/. .
          rm -rf migration

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "chore: import Alveus Dock 0.1.2 source"
          git push origin HEAD:main
