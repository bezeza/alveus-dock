name: Import Alveus Dock source snapshot

on:
  push:
    branches: [main]
    paths:
      - "migration/alveus-dock-0.1.2-source.zip"
      - ".github/workflows/import-source.yml"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover source files from archive local records
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct, zlib
          b = Path("migration/alveus-dock-0.1.2-source.zip").read_bytes()
          fields = struct.unpack_from("<HHHHHIIIHH", b, 4)
          version, flags, method, mt, md, crc, csize, usize, nlen, elen = fields
          start = 30 + nlen + elen
          print("FIRST_LOCAL", fields, "NAME", b[30:30+nlen], "DATA_START", start, "DATA_HEX", b[start:start+32].hex())
          for delta in range(-16,17):
              p = start + delta
              if p < 0: continue
              try:
                  raw = zlib.decompress(b[p:p+csize], -15)
                  got = zlib.crc32(raw) & 0xffffffff
                  print("DEFLATE_CANDIDATE", delta, "len", len(raw), "crc", hex(got), "matches", got == crc)
              except Exception as e:
                  pass
          PY
          false

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "chore: import Alveus Dock 0.1.2 source"
          git push origin HEAD:main
