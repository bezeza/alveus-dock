name: Import Alveus Dock source snapshot

on:
  push:
    branches: [main]
    paths:
      - "migration/alveus-dock-0.1.2-source.zip"
      - ".github/workflows/import-source.yml"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/alveus-dock-import
          python3 - <<'PY'
          from pathlib import Path
          import struct, zipfile
          archive = Path("migration/alveus-dock-0.1.2-source.zip")
          data = bytearray(archive.read_bytes())
          eocd = data.rfind(bytes.fromhex("504b0506"))
          central = data.find(bytes.fromhex("504b0102"))
          if eocd < 0 or central < 0:
              raise SystemExit("ZIP signatures missing; archive cannot be repaired safely")
          # The legacy snapshot's EOCD central-directory offset and size are both off by 18 bytes.
          central_size = eocd - central
          struct.pack_into("<L", data, eocd + 12, central_size)
          struct.pack_into("<L", data, eocd + 16, central)
          archive.write_bytes(data)
          with zipfile.ZipFile(archive) as zf:
              names = zf.namelist()
              print("REPAIRED_ENTRIES", len(names), names)
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"CRC check failed: {bad}")
              zf.extractall("/tmp/alveus-dock-import")
          PY
          test -d /tmp/alveus-dock-import/alveus-dock
          cp -a /tmp/alveus-dock-import/alveus-dock/. .
          rm -rf migration

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "chore: import Alveus Dock 0.1.2 source"
          git push origin HEAD:main
