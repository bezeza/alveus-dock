name: Import Alveus Dock source snapshot

on:
  push:
    branches: [main]
    paths:
      - "migration/alveus-dock-0.1.2-source.zip"
      - ".github/workflows/import-source.yml"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover source files from archive local records
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct, zlib
          b = Path("migration/alveus-dock-0.1.2-source.zip").read_bytes()
          pos = 0
          while b[pos:pos+4] == bytes.fromhex("504b0304"):
              fields = struct.unpack_from("<HHHHHIIIHH", b, pos+4)
              version, flags, method, mt, md, crc, csize, usize, nlen, elen = fields
              name = b[pos+30:pos+30+nlen].decode("utf-8", "replace")
              start = pos+30+nlen+elen
              payload = b[start:start+csize]
              print("ENTRY", name, "offset", pos, "flags", flags, "method", method, "csize", csize, "usize", usize, "start", start, "head", payload[:12].hex())
              try:
                  raw = zlib.decompress(payload, -15) if method == 8 else payload
                  print(" OK", len(raw), hex(zlib.crc32(raw)&0xffffffff), "expected", hex(crc))
              except Exception as e:
                  print(" FAIL", repr(e))
                  for delta in range(-8,9):
                      p=start+delta
                      try:
                          raw=zlib.decompress(b[p:p+csize],-15)
                          print(" OFFSET_CANDIDATE",delta,len(raw),hex(zlib.crc32(raw)&0xffffffff))
                      except Exception: pass
              pos=start+csize
          PY
          false

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "chore: import Alveus Dock 0.1.2 source"
          git push origin HEAD:main
