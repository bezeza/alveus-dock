name: Import Alveus Dock source snapshot

on:
  push:
    branches: [main]
    paths:
      - "migration/alveus-dock-0.1.2-source.zip"
      - ".github/workflows/import-source.yml"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover source files from archive local records
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct
          b=Path("migration/alveus-dock-0.1.2-source.zip").read_bytes()
          pos=0
          print("LOCAL RECORDS")
          while b[pos:pos+4]==bytes.fromhex("504b0304"):
              v,flags,method,mt,md,crc,cs,us,nl,el=struct.unpack_from("<HHHHHIIIHH",b,pos+4)
              name=b[pos+30:pos+30+nl]
              start=pos+30+nl+el
              print(pos, "flags",flags,"method",method,"csize",cs,"usize",us,"name_len",nl,"name",repr(name),"data",b[start:start+16].hex(),"next",start+cs)
              pos=start+cs
          print("LOCAL_STOP",pos,"NEXT",b[pos:pos+16].hex())
          pos=b.find(bytes.fromhex("504b0102"))
          print("CENTRAL RECORDS")
          while b[pos:pos+4]==bytes.fromhex("504b0102"):
              vals=struct.unpack_from("<4s6H3I5H2I",b,pos)
              _,made,need,flags,method,mt,md,crc,cs,us,nl,el,cl,disk,ia,ea,lo=vals
              name=b[pos+46:pos+46+nl]
              print(pos,"flags",flags,"method",method,"csize",cs,"usize",us,"name_len",nl,"extra",el,"comment",cl,"local_offset",lo,"name",repr(name))
              pos += 46+nl+el+cl
          print("CENTRAL_STOP",pos,"TAIL",b[pos:pos+32].hex())
          PY
          false

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "chore: import Alveus Dock 0.1.2 source"
          git push origin HEAD:main
