name: Import Alveus Dock source snapshot

on:
  push:
    branches: [main]
    paths:
      - "migration/alveus-dock-0.1.2-source.zip"
      - ".github/workflows/import-source.yml"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/alveus-dock-import
          python3 - <<'PY'
          from pathlib import Path
          import struct
          b = Path("migration/alveus-dock-0.1.2-source.zip").read_bytes()
          print("SIZE", len(b), "HEAD", b[:16].hex(), "TAIL", b[-32:].hex())
          for sig in (bytes.fromhex("504b0304"), bytes.fromhex("504b0102"), bytes.fromhex("504b0506")):
              pos=[]; i=0
              while True:
                  i=b.find(sig,i)
                  if i<0: break
                  pos.append(i); i+=1
              print("SIG", sig.hex(), pos[:100], "COUNT", len(pos))
          eocd=b.rfind(bytes.fromhex("504b0506"))
          if eocd>=0:
              fields=struct.unpack_from("<4s4H2LH",b,eocd)
              print("EOCD", fields, "at", eocd)
              cd_offset=fields[6]; cd_size=fields[5]
              print("CENTRAL_EXPECTED",cd_offset,cd_size,"BYTES",b[cd_offset:cd_offset+32].hex())
              for delta in range(-32,33):
                  off=cd_offset+delta
                  if b[off:off+4]==bytes.fromhex("504b0102"):
                      print("CENTRAL_FOUND_DELTA",delta,"OFFSET",off)
          PY
          unzip -t migration/alveus-dock-0.1.2-source.zip || true
          unzip -q migration/alveus-dock-0.1.2-source.zip -d /tmp/alveus-dock-import
          test -d /tmp/alveus-dock-import/alveus-dock
          cp -a /tmp/alveus-dock-import/alveus-dock/. .
          rm -rf migration

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "chore: import Alveus Dock 0.1.2 source"
          git push origin HEAD:main
