name: Import Alveus Dock source snapshot

on:
  push:
    branches: [main]
    paths:
      - "migration/alveus-dock-0.1.2-source.zip"
      - ".github/workflows/import-source.yml"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/alveus-dock-import
          python3 - <<'PY'
          from pathlib import Path
          import struct, zipfile
          p = Path("migration/alveus-dock-0.1.2-source.zip")
          b = p.read_bytes()
          print("ARCHIVE_BYTES", len(b), "HEAD", b[:16].hex(), "TAIL", b[-32:].hex())
          print("ZIP_SIGNATURES", {sig.hex(): [i for i in range(len(b)) if b.startswith(sig, i)][:20] for sig in (b"PK\\x03\\x04", b"PK\\x01\\x02", b"PK\\x05\\x06")})
          try:
              with zipfile.ZipFile(p) as z:
                  print("ZIP_ENTRIES", z.namelist())
                  print("ZIP_TEST", z.testzip())
          except Exception as e:
              print("ZIP_ERROR", repr(e))
          PY
          unzip -t migration/alveus-dock-0.1.2-source.zip || true
          unzip -q migration/alveus-dock-0.1.2-source.zip -d /tmp/alveus-dock-import
          test -d /tmp/alveus-dock-import/alveus-dock
          cp -a /tmp/alveus-dock-import/alveus-dock/. .
          rm -rf migration

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "chore: import Alveus Dock 0.1.2 source"
          git push origin HEAD:main
