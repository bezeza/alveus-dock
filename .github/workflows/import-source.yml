name: Import Alveus Dock source snapshot

on:
  push:
    branches: [main]
    paths:
      - "migration/alveus-dock-0.1.2-source.zip"
      - ".github/workflows/import-source.yml"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover source files from archive local records
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct, zlib
          b=Path("migration/alveus-dock-0.1.2-source.zip").read_bytes()
          sig=bytes.fromhex("504b0304")
          offsets=[]; i=0
          while True:
              i=b.find(sig,i)
              if i<0: break
              offsets.append(i); i+=4
          print("LOCAL_SIGNATURES",offsets)
          for pos in offsets:
              v,flags,method,mt,md,crc,cs,us,nl,el=struct.unpack_from("<HHHHHIIIHH",b,pos+4)
              name=b[pos+30:pos+30+nl].decode("utf-8","replace")
              start=pos+30+nl+el
              payload=b[start:start+cs]
              try:
                  raw=zlib.decompress(payload,-15) if method==8 else payload
                  ok=(len(raw)==us and (zlib.crc32(raw)&0xffffffff)==crc)
                  print("ENTRY_OK" if ok else "ENTRY_BADCRC",pos,repr(name),"flags",flags,"method",method,"csize",cs,"usize",us,"name_len",nl,"data_start",start,"data",payload[:8].hex(),"raw_len",len(raw),"crc",hex(zlib.crc32(raw)&0xffffffff))
              except Exception as e:
                  print("ENTRY_FAIL",pos,repr(name),"flags",flags,"method",method,"csize",cs,"usize",us,"name_len",nl,"data_start",start,"data",payload[:8].hex(),repr(e))
          PY
          false

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "chore: import Alveus Dock 0.1.2 source"
          git push origin HEAD:main
