name: Import Alveus Dock source snapshot

on:
  push:
    branches: [main]
    paths:
      - "migration/alveus-dock-0.1.2-source.zip"
      - ".github/workflows/import-source.yml"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover source files from archive local records
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct
          b=Path("migration/alveus-dock-0.1.2-source.zip").read_bytes()
          sig=bytes.fromhex("504b0102")
          positions=[]; i=0
          while True:
              i=b.find(sig,i)
              if i<0: break
              positions.append(i); i+=4
          print("CENTRAL_SIGNATURES",positions)
          for pos in positions:
              vals=struct.unpack_from("<4s6H3I5H2I",b,pos)
              _,made,need,flags,method,mt,md,crc,cs,us,nl,el,cl,disk,ia,ea,lo=vals
              name=b[pos+46:pos+46+nl]
              print("CENTRAL",pos,"flags",flags,"method",method,"csize",cs,"usize",us,"name_len",nl,"extra",el,"comment",cl,"local_offset",lo,"name",repr(name))
          PY
          false

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "chore: import Alveus Dock 0.1.2 source"
          git push origin HEAD:main
